<style>
/* Layout: one phone-width column, sticky bottom tab bar, bottom sheets for every form.
   Palette: black/anthracite surfaces, lime as the single accent, white text. */
:root{
  --bg:#0a0b0c; --s1:#141618; --s2:#1c1f22; --s3:#262a2e; --line:#2c3135;
  --lime:#c6f432; --lime-d:#a5d11a; --lime-ink:#10140a; --lime-soft:rgba(198,244,50,.14);
  --text:#ffffff; --mute:#9ba4aa; --dim:#68717a;
  --red:#ff5a5f; --amber:#ffb340; --cyan:#3fd6d0; --violet:#9b8cff; --pink:#ff7eb6;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --nav:68px;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
#app{max-width:560px;margin:0 auto;padding-block:14px calc(var(--nav) + 22px);min-height:100vh}
h1,h2,h3{margin:0;font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h1{font-size:34px;font-weight:800;font-style:italic;line-height:1}
h2{font-size:21px;font-weight:700;line-height:1.1}
h3{font-size:16px;font-weight:700;letter-spacing:.04em;color:var(--mute)}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
a{color:var(--lime)}
.ic{display:block;flex:none}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:12px}
.mute{color:var(--mute)} .dim{color:var(--dim)} .lime{color:var(--lime)} .small{font-size:13px} .tiny{font-size:11.5px}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* header */
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{font-family:var(--display);font-weight:800;font-style:italic;font-size:30px;letter-spacing:.03em;line-height:1;text-transform:uppercase}
.logo b{color:var(--lime);font-weight:800}
.back{width:40px;height:40px;border-radius:12px;background:var(--s2);display:grid;place-items:center}
.pagehead{display:flex;align-items:flex-end;gap:12px;margin:2px 0 16px}
.pagehead .sp h1{margin-top:2px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}

/* surfaces */
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px}
.card.flat{background:var(--s2);border-color:transparent}
.card.lime{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.card.lime .mute{color:rgba(16,20,10,.66)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.sec:first-child{margin-top:0}
.sec a,.sec button.lnk{font-size:13px;font-weight:600;color:var(--lime)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px;width:100%;text-align:left;min-width:0}
button.item:active,.tap:active{background:var(--s2)}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .big{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--s2);border-radius:14px;padding:11px 12px;min-width:0}
.stat .v{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05}
.stat .l{font-size:11.5px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;background:var(--lime);color:var(--lime-ink);font-weight:700;font-size:15px;letter-spacing:.01em;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--s2);color:var(--text)}
.btn.line{background:none;border:1px solid var(--line);color:var(--text)}
.btn.danger{background:rgba(255,90,95,.14);color:var(--red)}
.btn.sm{min-height:36px;padding:0 13px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn.armed{background:var(--red);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.ibtn{width:40px;height:40px;border-radius:12px;background:var(--s2);display:grid;place-items:center;color:var(--text);flex:none}
.ibtn.sm{width:34px;height:34px;border-radius:10px}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:3px;gap:2px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-height:36px;padding:0 12px;border-radius:11px;font-weight:600;font-size:13.5px;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--lime);color:var(--lime-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:0 10px;border-radius:99px;background:var(--s2);color:var(--mute);font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--lime-soft);color:var(--lime)}
.chip.solid{background:var(--lime);color:var(--lime-ink)}
button.chip{cursor:pointer}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-bottom:2px}
.hscroll::-webkit-scrollbar{display:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:46px;width:100%;min-width:0;text-transform:none;letter-spacing:0;font-weight:500}
textarea{padding:11px 12px;min-height:84px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input::placeholder,textarea::placeholder{color:var(--dim)}
.frow{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.sw{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border:0}
.tog{width:46px;height:28px;border-radius:99px;background:var(--s3);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}

function makeDB(){
  const L=new Set();

  const clone=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
  const merge=(a,b)=>{const r=Object.assign({},a);for(const k in b){const v=b[k];r[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&r[k]&&typeof r[k]==='object'&&!Array.isArray(r[k]))?merge(r[k],v):v}return r};
  const snapDoc=(id,data)=>({id,exists:data!==undefined,data:()=>clone(data),metadata:{fromCache:false,hasPendingWrites:false}});
  function notify(parent){L.forEach(l=>{if(!parent||l.parent===parent)l.kick()})}
  function listen(parent,run){const l={parent,t:null,alive:true,kick(){clearTimeout(l.t);l.t=setTimeout(()=>{if(l.alive)run()},60)}};L.add(l);l.kick();return ()=>{l.alive=false;clearTimeout(l.t);L.delete(l)}}
  async function getRow(path){const r=await sb.from('docs').select('data').eq('path',path).maybeSingle();if(r.error)throw mapErr(r.error);return r.data?r.data.data:undefined}
  async function fetchCol(path,o){
    const r=await sb.from('docs').select('id,data').eq('parent',path).limit(1000);if(r.error)throw mapErr(r.error);
    let rows=r.data.map(x=>({id:x.id,data:x.data}));
    if(o.ob){const f=o.ob,dir=o.dir==='desc'?-1:1;rows.sort((a,b)=>{const x=a.data[f],y=b.data[f];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return (x<y?-1:x>y?1:0)*dir})}
    else rows.sort((a,b)=>a.id<b.id?-1:1);
    if(o.lim)rows=rows.slice(0,o.lim);return rows;
  }
  const docRef=path=>({id:idOf(path),path,
    get:async()=>snapDoc(idOf(path),await getRow(path)),
    set:async d=>{const r=await sb.from('docs').upsert({path,parent:parentOf(path),id:idOf(path),data:clone(d),updated_at:new Date().toISOString()});if(r.error)throw mapErr(r.error);notify(parentOf(path))},
    update:async d=>{const cur=await getRow(path);if(cur===undefined)throw {code:'invalid_argument',message:'documento inesistente'};await docRef(path).set(merge(cur,clone(d)))},
    delete:async()=>{const r=await sb.from('docs').delete().eq('path',path);if(r.error)throw mapErr(r.error);notify(parentOf(path))},
    onSnapshot(next,err){return listen(parentOf(path),async()=>{try{next(snapDoc(idOf(path),await getRow(path)))}catch(e){err&&err(e)}})},
    collection:n=>colRef(path+'/'+n)});
  const mkQ=(path,o)=>{

      onSnapshot(next,err){let prev=[];return listen(path,async()=>{try{const rows=await fetchCol(path,o),docs=rows.map(x=>snapDoc(x.id,x.data)),ch=docs.filter(d=>!prev.includes(d.id)).map(d=>({type:'added',doc:d}));prev=docs.map(d=>d.id);next({docs,size:docs.length,empty:!docs.length,docChanges:()=>ch,metadata:{}})}catch(e){err&&err(e)}})}};
    return q};
  const rid=()=>(window.crypto&&crypto.randomUUID?crypto.randomUUID().replace(/-/g,'').slice(0,20):Date.now().toString(36)+Math.random().toString(36).slice(2,10));
  function colRef(path){return Object.assign(mkQ(path,{}),{path,doc:id=>docRef(path+'/'+(id||rid())),add:async d=>{const r=docRef(path+'/'+rid());await r.set(d);return r}})}

      setInterval(()=>notify(null),30000);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)notify(null)});
    }};
}

function computeStats(sessions){const t={n:0,min:0,km:0,vol:0},daily={},cut=dkey(addDays(new Date(),-120));for(const s of sessions){t.n++;t.min+=s.min||0;t.km+=s.km||0;t.vol+=s.vol||0;if(s.date>=cut){const d=daily[s.date]||(daily[s.date]=[0,0,0]);d[0]++;d[1]+=s.min||0;d[2]=+(d[2]+(s.km||0)).toFixed(2)}}t.km=+t.km.toFixed(2);t.vol=Math.round(t.vol);t.min=Math.round(t.min);return {t,daily}}
async function publishStats(sessions,me){me=me||S.me;sessions=sessions||S.sessions;if(!me)return;if(me.vis&&me.vis.stats===false){await W(C('stats').doc(uid).delete());return}const {t,daily}=computeStats(sessions);await W(C('stats').doc(uid).set({t,daily,upd:Date.now()}))}
function derive(st){const t=st.t||{n:0,min:0,km:0,vol:0},days=Object.keys(st.daily||{}).sort();let streak=0,best=0,prev=null;for(const k of days){if(prev&&dkey(addDays(pdate(prev),1))===k)streak++;else streak=1;best=Math.max(best,streak);prev=k}const wk={};for(const k of days){const w=wkKey(pdate(k));wk[w]=(wk[w]||0)+st.daily[k][0]}return {n:t.n,hours:t.min/60,km:t.km,vol:t.vol,streak:best,bestWeek:Math.max(0,...Object.values(wk))}}

/* ---------- grafici ---------- */
function lineChart(pts,w=320,h=140,unit=''){
  if(pts.length<2)return `<div class="empty small" style="padding:18px">Servono almeno due misurazioni per il grafico.</div>`;
  const vs=pts.map(p=>p[1]),mn=Math.min(...vs),mx=Math.max(...vs),pd=(mx-mn)||1,lo=mn-pd*.25,hi=mx+pd*.25,L=34,R=8,T=10,B=22;
  const X=i=>L+(w-L-R)*i/(pts.length-1),Y=v=>T+(h-T-B)*(1-(v-lo)/(hi-lo));
  const path=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
  const ticks=[lo+(hi-lo)*.1,(lo+hi)/2,hi-(hi-lo)*.1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Andamento">${ticks.map(t=>`<line x1="${L}" x2="${w-R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--line)"/><text x="${L-5}" y="${(Y(t)+3).toFixed(1)}" text-anchor="end">${nf(t,1)}</text>`).join('')}
   <path d="${path}L${X(pts.length-1).toFixed(1)} ${h-B}L${L} ${h-B}Z" fill="var(--lime)" opacity=".1"/><path d="${path}" fill="none" stroke="var(--lime)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${X(pts.length-1).toFixed(1)}" cy="${Y(vs[vs.length-1]).toFixed(1)}" r="4" fill="var(--lime)"/>
   <text x="${L}" y="${h-6}">${fmtD(pts[0][0])}</text><text x="${w-R}" y="${h-6}" text-anchor="end">${fmtD(pts[pts.length-1][0])}</text></svg>`;
}
function barChart(vals,labels,w=320,h=120,hi){
  const mx=Math.max(1,...vals),bw=(w-10)/vals.length;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Allenamenti per settimana">${vals.map((v,i)=>{const bh=Math.round((h-30)*v/mx),x=5+i*bw+bw*.18,y=h-20-bh;return `<rect x="${x.toFixed(1)}" y="${y}" width="${(bw*.64).toFixed(1)}" height="${Math.max(bh,2)}" rx="4" fill="${i===hi?'var(--lime)':'var(--s3)'}"/><text x="${(x+bw*.32).toFixed(1)}" y="${y-4}" text-anchor="middle" style="fill:var(--text);font-weight:700">${v||''}</text><text x="${(x+bw*.32).toFixed(1)}" y="${h-6}" text-anchor="middle">${esc(labels[i])}</text>`}).join('')}</svg>`;
}
function ring(v,t,size=96,label){
  const r=size/2-8,c=2*Math.PI*r,p=clamp(v/Math.max(t,1),0,1);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${v} su ${t}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="currentColor" opacity=".18" stroke-width="9"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="52%" text-anchor="middle" fill="currentColor" style="font-family:var(--display);font-weight:800;font-size:${size*.3}px">${v}</text><text x="50%" y="${size*.76}" text-anchor="middle" fill="currentColor" opacity=".7" style="font-size:${size*.115}px;font-weight:600">${label||'su '+t}</text></svg>`;
}
function calendarHTML(m,marks,opts){
  opts=opts||{};const first=new Date(m.getFullYear(),m.getMonth(),1),n=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),off=(first.getDay()+6)%7,tk=todayKey();
  let h='<div class="cal">'+['L','M','M','G','V','S','D'].map(x=>`<div class="h">${x}</div>`).join('');
  for(let i=0;i<off;i++)h+='<div class="d o"></div>';
  for(let d=1;d<=n;d++){const k=m.getFullYear()+'-'+pad(m.getMonth()+1)+'-'+pad(d),mk=marks[k];h+=`<div class="d ${mk&&mk.w?'w':''} ${k===tk?'t':''}" ${opts.act?`data-act="${opts.act}" data-k="${k}"`:''}>${d}${mk&&mk.dot?'<i></i>':''}</div>`}
  return h+'</div>';
}

/* ---------- connessione ai dati ---------- */
function watch(key,q,fn){
  const to=setTimeout(()=>{S.slow=true;render()},10000);
  return q.onSnapshot(snap=>{clearTimeout(to);S.slow=false;fn(snap);S.loaded[key]=true;render()},e=>{clearTimeout(to);console.error(key,e);S.err=(e&&e.code)||'errore';render()});
}
const rows=snap=>snap.docs.map(d=>Object.assign({id:d.id},d.data()));
const rmap=snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});return o};
function startWatches(){
  watch('group',db.doc('group/main'),s=>{S.group=s.exists?s.data():null;if(!s.exists&&S.status&&S.status.admin&&!S.gc){S.gc=1;db.doc('group/main').set({name:S.status.name,by:uid,created:Date.now()})}});
  watch('members',C('members'),s=>{S.members=rmap(s)});
  watch('profiles',C('profiles'),s=>{S.profiles=rmap(s)});
  watch('stats',C('stats'),s=>{S.stats=rmap(s)});
  watch('banned',C('banned'),s=>{S.banned=rmap(s)});
  watch('me',meDoc(),s=>{S.me=s.exists?s.data():null});
  watch('feed',C('feed').orderBy('ts','desc').limit(150),s=>{
    if(S.loaded.feed){s.docChanges().forEach(c=>{if(c.type==='added'){const f=c.doc.data();if(f.uid!==uid&&f.ts>S.t0-30000)toast(feedPlain(f))}})}
    S.feed=rows(s)});
  watch('comments',C('comments').orderBy('ts','desc').limit(1000),s=>{S.comments=rows(s);indexSocial();refreshThreads()});
  watch('likes',C('likes').limit(2000),s=>{S.likes=rows(s);indexSocial()});
  watch('shop',C('shop').limit(500),s=>{S.shop=rows(s)});
  watch('challenges',C('challenges').limit(100),s=>{S.challenges=rows(s)});
  watch('sessions',mine('sessions').orderBy('date','desc').limit(500),s=>{S.sessions=rows(s)});
  watch('plans',mine('plans').limit(100),s=>{S.plans=rows(s)});
  watch('exs',mine('exs').limit(200),s=>{S.exs=rows(s)});
  watch('weights',mine('weights').orderBy('date','asc').limit(400),s=>{S.weights=rows(s)});
  watch('goals',mine('goals').limit(60),s=>{S.goals=rows(s)});
  watch('schedules',mine('schedules').limit(30),s=>{S.schedules=rows(s)});
  watchMyWeek();watchMenu();
}

function watchMyWeek(){const wk=wkKey(new Date());if(myWkKey===wk)return;myWkKey=wk;if(unMy)unMy();unMy=C('menus').doc(uid).collection('weeks').doc(wk).onSnapshot(s=>{S.myWeek=s.exists?s.data():null;render()},()=>{})}
function watchMenu(){

/* ---------- render ---------- */
let rq=false;
function render(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;try{draw()}catch(e){console.error(e);$('#view').innerHTML='<div class="card warn">Errore di visualizzazione: '+esc(e.message)+'</div>'}})}
function typing(){const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.closest('#view')&&!a.id}
function draw(){
  if(S.down||typing()){S.dirty=true;return}
  const gate=gateState();
  if(gate){$('#nav').hidden=true;$('#view').innerHTML=gate;return}
  watchMyWeek();
  $('#nav').hidden=false;
  const T=S.ui.tab,P=S.ui.page;
  let h;
  if(P==='sfide')h=viewSfide();else if(P==='gruppo')h=viewGruppo();
  else h=({home:viewHome,work:viewWork,shop:viewShop,menu:viewMenu,me:viewProfile}[T]||viewHome)();
  const fa=document.activeElement,keep=fa&&fa.id&&fa.closest&&fa.closest('#view')?{id:fa.id,v:fa.value,a:fa.selectionStart,b:fa.selectionEnd}:null;
  $('#view').innerHTML=h;
  if(keep){const n=document.getElementById(keep.id);if(n){n.value=keep.v;n.focus({preventScroll:true});try{n.setSelectionRange(keep.a,keep.b)}catch(e){}}}
  const left=S.shop.filter(i=>!i.done).length;
  $('#nav>div').innerHTML=[['home','Home','home'],['work','Allenamenti','dumbbell'],['shop','Spesa','cart'],['menu','Menu','fork'],['me','Profilo','user']].map(([k,l,i])=>`<button class="${T===k&&!P?'on':''}" data-act="tab" data-t="${k}" aria-label="${l}">${ic(i,24)}<span>${l}</span>${k==='shop'&&left?`<span class="badge">${left>99?'99+':left}</span>`:''}</button>`).join('');
}
function pop(){const v=$('#view');v.classList.remove('anim');void v.offsetWidth;v.classList.add('anim');clearTimeout(pop.t);pop.t=setTimeout(()=>v.classList.remove('anim'),800)}
function go(t){pop();S.ui.tab=t;S.ui.page=null;try{localStorage.setItem('fl_tab',t)}catch(e){}window.scrollTo(0,0);render()}
function page(p){pop();S.ui.page=p;window.scrollTo(0,0);render()}

const ACT={};
document.addEventListener('pointerdown',()=>{S.down=true},true);
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{S.down=false;setTimeout(()=>{if(S.dirty&&!S.down&&!typing()){S.dirty=false;render()}},350)},true));
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.dirty&&!S.down&&!typing()){S.dirty=false;render()}},400));
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.confirm&&!el.classList.contains('armed')){el.classList.add('armed');el.dataset.orig=el.innerHTML;el.textContent='Tocca ancora per confermare';setTimeout(()=>{if(el.isConnected&&el.classList.contains('armed')){el.classList.remove('armed');el.innerHTML=el.dataset.orig}},3000);return}
  const f=ACT[el.dataset.act];if(!f)return;e.preventDefault();
  try{const r=f(el.dataset,el,e);if(r&&r.catch)r.catch(err=>{console.error(err);toast('Qualcosa non ha funzionato')})}catch(err){console.error(err);toast('Qualcosa non ha funzionato')}

document.addEventListener('input',e=>{const t=e.target;if(!t.dataset)return;if(t.dataset.b)setPath(S,t.dataset.b,t.type==='checkbox'?t.checked:t.value);if(t.dataset.ev&&ACT[t.dataset.ev])ACT[t.dataset.ev](t.dataset,t,e)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter&&e.target.tagName!=='TEXTAREA'){e.preventDefault();ACT[e.target.dataset.enter](e.target.dataset,e.target,e)}});

const pageHead=(kicker,title,backBtn)=>`<div class="pagehead">${backBtn?`<button class="back" data-act="back" aria-label="Indietro">${ic('left')}</button>`:''}<div class="sp"><div class="kicker">${kicker}</div><h1>${title}</h1></div></div>`;
const avStrip=()=>`<div class="hscroll">${memberIds().sort((a,b)=>a===uid?-1:b===uid?1:nick(a).localeCompare(nick(b))).map(u=>`<button class="avs ${u===uid?'me':''}" data-act="member" data-u="${u}">${avatar(prof(u).avatar,52)}<span class="ellip">${u===uid?'Tu':esc(nick(u))}</span></button>`).join('')}</div>`;
const statRange=(st,a,b)=>{let n=0,min=0,km=0;for(const k in (st.daily||{})){if(k>=a&&k<=b){const d=st.daily[k];n+=d[0];min+=d[1];km+=d[2]}}return {n,min:Math.round(min),km:+km.toFixed(1)}};
function periodRange(p){const now=new Date();if(p==='week'){const a=mondayOf(now);return [dkey(a),dkey(addDays(a,6))]}if(p==='month')return [dkey(new Date(now.getFullYear(),now.getMonth(),1)),dkey(new Date(now.getFullYear(),now.getMonth()+1,0))];return null}
const myStat=()=>computeStats(S.sessions);
function weekDots(st){const m=mondayOf(new Date());return `<div class="row" style="gap:6px;margin-top:12px">${DK.map((_,i)=>{const k=dkey(addDays(m,i)),on=st.daily[k];return `<div style="flex:1;text-align:center"><div style="height:30px;border-radius:9px;background:${on?'var(--lime-ink)':'rgba(16,20,10,.14)'};color:var(--lime);display:grid;place-items:center">${on?ic('check',16):''}</div><div class="tiny" style="margin-top:3px;opacity:.7;font-weight:700">${DAYS[i][0]}</div></div>`}).join('')}</div>`}

function miniRank(){

function feedCard(f){
  const p=prof(f.uid),t='f:'+f.id,li=S.likeIdx[t]||{n:0,me:false},cn=S.comIdx[t]||0,n='<b>'+esc(p.nick)+'</b>',x=f.ex||{};
  let tx,meta='';
  switch(f.k){
   case 'workout':tx=`${n} ha completato <b>${esc(f.txt)}</b>`;meta=[x.cat&&CAT[x.cat],x.min&&hm(x.min),x.km&&nf(x.km)+' km',x.vol&&nf(x.vol/1000,1)+' t sollevate',x.n&&x.n+' esercizi'].filter(Boolean).map(c=>`<span class="chip">${esc(c)}</span>`).join('');break;
   case 'shop':tx=`${n} ha aggiunto <b>${esc(f.txt)}</b> alla spesa`;break;
   case 'menu':tx=`${n} ha aggiornato il menu · <b>${esc(f.txt)}</b>`;break;
   case 'note':tx=`${n}<br>${esc(f.txt).replace(/\n/g,'<br>')}`;break;
   case 'challenge':tx=`${n} ha lanciato la sfida <b>${esc(f.txt)}</b>`;break;
   case 'badge':tx=`${n} ha sbloccato il badge <b>${esc(f.txt)}</b>`;meta=`<span class="chip solid">${ic('star',14)}Nuovo badge</span>`;break;
   case 'goal':tx=`${n} ha raggiunto un obiettivo: <b>${esc(f.txt)}</b>`;break;
   case 'join':tx=`${n} è entrato nel gruppo`;break;
   default:tx=n}

function bacheca(notes){

}

/* ---------- CLASSIFICHE E SFIDE ---------- */
function rankList(per){
  const r=periodRange(per);
  return memberIds().filter(u=>S.stats[u]).map(u=>{const st=S.stats[u];const v=r?statRange(st,r[0],r[1]):{n:st.t.n,min:Math.round(st.t.min),km:st.t.km};return {u,n:v.n,min:v.min,km:v.km}}).filter(x=>per==='all'||x.n>0||x.u===uid).sort((a,b)=>b.n-a.n||b.min-a.min||nick(a.u).localeCompare(nick(b.u)));
}
const chStatus=c=>{const t=todayKey();return t<c.start?'next':t>c.end?'end':'on'};
const METR={n:['allenamenti',0],min:['minuti',1],km:['km',2]};
function chProg(c){
  const per=memberIds().filter(u=>S.stats[u]).map(u=>{const v=statRange(S.stats[u],c.start,c.end);return {u,v:{n:v.n,min:v.min,km:v.km}[c.metric]}}).sort((a,b)=>b.v-a.v);
  const tot=per.reduce((s,x)=>s+x.v,0);return {per,tot,lead:per[0]?per[0].v:0};
}
function chDone(c){const p=chProg(c);return c.kind==='group'?p.tot>=c.target:p.per.some(x=>x.u===uid&&x.v>=c.target)}
function viewSfide(){
  const sg=S.ui.sfSeg,seg=[['class','Classifica'],['sfide','Sfide'],['badge','Badge'],['conf','Confronto']];
  return `${pageHead('Motivazione','Sfide e classifiche',1)}<div class="seg">${seg.map(([k,l])=>`<button class="${sg===k?'on':''}" data-act="sfSeg" data-s="${k}">${l}</button>`).join('')}</div>${({class:tabClass,sfide:tabSfide,badge:tabBadge,conf:tabConf}[sg]||tabClass)()}`;
}
function tabClass(){
  const per=S.ui.period,list=rankList(per),pos=[['week','Settimana'],['month','Mese'],['all','Sempre']];
  return `<div class="seg" style="background:var(--s2)">${pos.map(([k,l])=>`<button class="${per===k?'on':''}" data-act="period" data-p="${k}">${l}</button>`).join('')}</div>
  ${list.length?`<div class="list">${list.map((x,i)=>{const p=prof(x.u),rk=list.findIndex(y=>y.n===x.n)+1;return `<button class="rank ${x.u===uid?'me':''}" data-act="member" data-u="${x.u}" style="text-align:left;width:100%"><div class="pos">${rk}</div>${avatar(p.avatar,42)}<div class="sp"><b class="ellip" style="display:block">${esc(p.nick)}${x.u===uid?' (tu)':''}</b><span class="small mute">${hm(x.min)}${x.km?' · '+nf(x.km)+' km':''}</span></div><div style="text-align:right"><div class="disp" style="font-size:30px;font-weight:800;line-height:1;color:var(--lime)">${x.n}</div><div class="tiny mute">allenamenti</div></div></button>`}).join('')}</div>`:`<div class="empty"><b>Nessun allenamento in questo periodo</b>Completa il tuo primo allenamento per aprire la classifica.</div>`}
  <p class="small mute" style="margin-top:12px">La classifica conta solo gli allenamenti completati, mai il peso corporeo. Chi nasconde le statistiche dal profilo non compare.</p>`;
}
function tabSfide(){
  const cs=S.challenges.slice().sort((a,b)=>a.start<b.start?1:-1),g={on:[],next:[],end:[]};cs.forEach(c=>g[chStatus(c)].push(c));
  const m=S.ui.chM?new Date(S.ui.chM):new Date(),marks={};cs.forEach(c=>{for(let d=pdate(c.start);dkey(d)<=c.end;d=addDays(d,1))marks[dkey(d)]={dot:true}});
  const sec=(t,a)=>a.length?`<div class="sec"><h2>${t}</h2></div><div class="list">${a.map(chCard).join('')}</div>`:'';
  return `<button class="btn block" data-act="newch">${ic('plus',18)}Lancia una nuova sfida</button>
  <div class="card" style="margin-top:14px"><div class="row" style="margin-bottom:10px"><button class="ibtn sm" data-act="chM" data-n="-1" aria-label="Mese precedente">${ic('left',16)}</button><div class="sp disp" style="text-align:center;font-size:18px;font-weight:700">${MESI[m.getMonth()]} ${m.getFullYear()}</div><button class="ibtn sm" data-act="chM" data-n="1" aria-label="Mese successivo">${ic('right',16)}</button></div>${calendarHTML(m,marks)}<p class="tiny mute" style="margin-top:8px"><span style="color:var(--amber)">●</span> giorni con una sfida attiva</p></div>
  ${sec('In corso',g.on)}${sec('Prossime',g.next)}${sec('Concluse',g.end)}${cs.length?'':`<div class="empty" style="margin-top:14px"><b>Nessuna sfida</b>Lancia la prima: un obiettivo comune per tutto il gruppo o una gara a chi fa di più.</div>`}`;
}
function chCard(c){
  const p=chProg(c),mt=METR[c.metric],cur=c.kind==='group'?p.tot:p.lead,pct=clamp(cur/c.target*100,0,100),stt=chStatus(c);

const PAL=['var(--lime)','var(--cyan)','var(--amber)','var(--violet)','var(--pink)','#ffffff'];
function tabConf(){
  const ids=memberIds().filter(u=>S.stats[u]);
  if(ids.length<1)return `<div class="empty"><b>Nessun dato da confrontare</b>Qui compaiono i membri che condividono le proprie statistiche.</div>`;
  const wk0=mondayOf(new Date()),weeks=[...Array(8)].map((_,i)=>addDays(wk0,(i-7)*7)),lab=weeks.map(w=>w.getDate()+'/'+(w.getMonth()+1)),W8=ids.slice(0,6).map(u=>weeks.map(w=>statRange(S.stats[u],dkey(w),dkey(addDays(w,6))).n));
  const mx=Math.max(1,...W8.flat()),w=330,h=150,gw=(w-12)/8,bw=gw*.8/ids.slice(0,6).length;
  const svg=`<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Allenamenti per settimana, confronto">${[0,.5,1].map(f=>`<line x1="6" x2="${w-6}" y1="${(h-22-(h-34)*f).toFixed(1)}" y2="${(h-22-(h-34)*f).toFixed(1)}" stroke="var(--line)"/>`).join('')}<text x="6" y="12">${mx}</text>${W8.map((arr,si)=>arr.map((v,wi)=>{const bh=(h-34)*v/mx;return `<rect x="${(6+wi*gw+gw*.1+si*bw).toFixed(1)}" y="${(h-22-bh).toFixed(1)}" width="${(bw-1).toFixed(1)}" height="${Math.max(bh,v?1.5:0).toFixed(1)}" rx="2" fill="${PAL[si]}"/>`}).join('')).join('')}${lab.map((l,i)=>`<text x="${(6+i*gw+gw/2).toFixed(1)}" y="${h-6}" text-anchor="middle">${l}</text>`).join('')}</svg>`;
  return `<div class="card"><div class="kicker" style="margin-bottom:8px">Allenamenti per settimana (ultime 8)</div>${svg}<div class="chips" style="margin-top:8px">${ids.slice(0,6).map((u,i)=>`<span class="chip"><span style="width:9px;height:9px;border-radius:50%;background:${PAL[i]}"></span>${esc(nick(u))}</span>`).join('')}</div></div>
  <div class="sec"><h2>Totali</h2></div><div class="list">${ids.map(u=>{const st=S.stats[u],p=prof(u),wh=p.wh;const dw=wh&&wh.length>1?wh[wh.length-1][1]-wh[0][1]:null;return `<button class="item" style="flex-direction:column;align-items:stretch" data-act="member" data-u="${u}"><div class="row">${avatar(p.avatar,36)}<b class="sp">${esc(p.nick)}${u===uid?' (tu)':''}</b></div><div class="grid3"><div class="stat"><div class="v">${st.t.n}</div><div class="l">Allen.</div></div><div class="stat"><div class="v">${nf(st.t.min/60,0)}</div><div class="l">Ore</div></div><div class="stat"><div class="v">${nf(st.t.km,0)}</div><div class="l">Km</div></div></div>${dw!=null?`<div class="small mute">Peso condiviso: <b style="color:var(--text)">${dw>0?'+':''}${nf(dw,1)} kg</b></div>`:''}</button>`}).join('')}</div>
  <p class="small mute" style="margin-top:12px">Il confronto include solo chi ha scelto di condividere statistiche e, per il peso, solo chi ha attivato la condivisione.</p>`;
}

}
function startLive(title,cat,entries){

const saveLive=()=>{try{if(S.live)localStorage.setItem('fl_live_'+uid,JSON.stringify(S.live));else localStorage.removeItem('fl_live_'+uid)}catch(e){}};

function drawLive(){
  const el=$('#live'),L=S.live;
  if(!L||S.liveMin){el.hidden=true;el.innerHTML='';render();return}
  const top=el.scrollTop;el.hidden=false;
  const heads={r:['KG','RIPS'],t:['SEC','KG'],c:['MIN','KM']};
  el.innerHTML=`<div><div class="row" style="margin-bottom:14px"><button class="back" data-act="livemin" aria-label="Riduci">${ic('left')}</button><div class="sp"><div class="kicker" id="liveT">${liveElapsed()}</div><input data-b="live.title" value="${esc(L.title)}" style="min-height:36px;padding:0 4px;background:none;border:0;font-family:var(--display);font-size:24px;font-weight:800;text-transform:uppercase;font-style:italic" aria-label="Titolo allenamento"></div><button class="btn sm" data-act="livefin">Termina</button></div>
  ${L.entries.length?L.entries.map((en,i)=>{const h=heads[en.type]||heads.r,ex=exById(en.ex);return `<div class="card col" style="margin-bottom:12px;gap:10px"><div class="row"><button class="exthumb" style="width:44px;height:44px" data-act="liveinfo" data-id="${en.ex}" aria-label="Info esercizio">${ex?bodySVG(ex.m,ex.m2):''}</button><div class="sp"><b>${esc(en.name)}</b><div class="small mute">Obiettivo ${esc(en.target||'')}${en.rest?' · recupero '+en.rest+' s':''}</div></div><button class="ibtn sm" data-act="rmex" data-i="${i}" data-confirm="1" aria-label="Rimuovi esercizio">${ic('trash',15)}</button></div>
  <div class="setrow tiny mute" style="margin:0"><span></span><span style="text-align:center">${h[0]}</span><span style="text-align:center">${h[1]}</span><span></span></div>
  ${en.sets.map((s,j)=>{const a=en.type==='t'?'sec':en.type==='c'?'min':'kg',b=en.type==='t'?'kg':en.type==='c'?'km':'reps';return `<div class="setrow ${s.done?'done':''}"><span class="n">${j+1}</span><input data-b="live.entries.${i}.sets.${j}.${a}" value="${esc(s[a])}" inputmode="decimal" placeholder="–" aria-label="${h[0]} serie ${j+1}"><input data-b="live.entries.${i}.sets.${j}.${b}" value="${esc(s[b])}" inputmode="decimal" placeholder="${b==='reps'?esc((en.target||'').split(/[-\s]/)[0]||'–'):'–'}" aria-label="${h[1]} serie ${j+1}"><button class="check ${s.done?'on':''}" data-act="setdone" data-i="${i}" data-j="${j}" aria-label="Serie completata">${ic('check',20)}</button></div>`}).join('')}
  ${en.type==='c'?'':`<div class="row"><button class="btn ghost sm" data-act="addset" data-i="${i}">${ic('plus',15)}Serie</button>${en.sets.length>1?`<button class="btn ghost sm" data-act="delset" data-i="${i}">Togli ultima</button>`:''}</div>`}</div>`}).join(''):`<div class="empty" style="margin-bottom:12px"><b>Allenamento vuoto</b>Aggiungi gli esercizi che stai facendo.</div>`}
  <button class="btn ghost block" data-act="liveadd">${ic('plus',18)}Aggiungi esercizio</button><button class="btn danger block" style="margin-top:10px" data-act="livedrop" data-confirm="1">Annulla allenamento</button></div><div class="restbar" id="rest" hidden><div><div class="sp"><div class="kicker">Recupero</div><div class="disp num" id="restT" style="font-size:34px;font-weight:800;color:var(--lime);line-height:1">0:00</div></div><button class="btn ghost sm" data-act="restadd">+30 s</button><button class="btn sm" data-act="restskip">Salta</button></div></div>`;
  el.scrollTop=top;tickLive();
}
function liveElapsed(){const s=Math.floor((Date.now()-S.live.startedAt)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+pad(m):m)+':'+pad(s%60)}
function tickLive(){
  if(!S.live||S.liveMin)return;const t=$('#liveT');if(t)t.textContent=liveElapsed();const r=S.live.rest,bar=$('#rest');if(!bar)return;
  if(r&&r.until>Date.now()){bar.hidden=false;const s=Math.ceil((r.until-Date.now())/1000);$('#restT').textContent=Math.floor(s/60)+':'+pad(s%60)}else if(r){S.live.rest=null;bar.hidden=true;try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}toast('Recupero finito: tocca a te',1)}else bar.hidden=true;
}
setInterval(tickLive,500);
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.b&&e.target.dataset.b.startsWith('live.'))saveLive()});
function finishSheet(){

  <button class="btn block" data-act="finsave">${ic('check',18)}Salva allenamento completato</button></div>`,{onClose:()=>{}});

async function saveSession(s,share,wasLive){
  const before=earned(computeStats(S.sessions));
  const fref=share?C('feed').doc():null;
  if(fref)s.feedId=fref.id;s.shared=!!share;
  if(!await W(mine('sessions').doc(s.id).set(s)))return false;
  if(fref)await W(fref.set({uid,k:'workout',txt:s.title,ts:Date.now(),ex:{cat:s.cat,min:s.min,km:s.km||0,vol:s.vol||0,n:(s.entries||[]).length}}));
  const all=S.sessions.filter(x=>x.id!==s.id).concat([s]);
  await publishStats(all);
  const after=earned(computeStats(all)),nw=after.filter(b=>!before.includes(b));
  for(const b of nw){const nm=BADGES.find(x=>x[0]===b)[1];toast('Nuovo badge: '+nm,1);if(share!==false)await postFeed('badge',nm)}
  await checkGoals(all);
  return true;
}
function goalVal(g,all){const st=computeStats(all),now=new Date();let a,b;if(g.period==='week'){a=wkKey(now);b=dkey(addDays(pdate(a),6))}else if(g.period==='month'){a=dkey(new Date(now.getFullYear(),now.getMonth(),1));b=dkey(new Date(now.getFullYear(),now.getMonth()+1,0))}else{a=dkey(new Date(g.ts));b='9999'}
  const r=statRange(st,a,b),per=g.period==='all'?{n:all.filter(s=>s.date>=a).length,min:Math.round(all.filter(s=>s.date>=a).reduce((x,s)=>x+(s.min||0),0)),km:+all.filter(s=>s.date>=a).reduce((x,s)=>x+(s.km||0),0).toFixed(1)}:r;return per[g.metric]}
const goalKey=g=>g.period==='week'?wkKey(new Date()):g.period==='month'?todayKey().slice(0,7):'all';
async function checkGoals(all){
  for(const g of S.goals){const key=goalKey(g),h=g.hist||[];if(h.includes(key))continue;if(goalVal(g,all)>=g.target){await W(mine('goals').doc(g.id).update({hist:h.concat([key])}));toast('Obiettivo raggiunto: '+g.title,1);await postFeed('goal',g.title)}}
}

async function addIngredients(list){
  let add=0,mrg=0;
  for(const it of list){
    const n=(it.n||'').trim();if(!n)continue;const u=it.u||'',qv=numv(it.q);
    const ex=S.shop.find(s=>!s.done&&s.n.toLowerCase()===n.toLowerCase());
    if(ex){const a=parseQ(ex.q);if(a&&qv!=null&&a.u===u){await W(C('shop').doc(ex.id).update({q:joinQ(a.v+qv,u)}));mrg++;continue}if(!ex.q&&qv==null){mrg++;continue}}
    await W(C('shop').add({n,q:qv!=null?joinQ(qv,u):'',cat:guessCat(n),note:'dal menu',by:uid,at:Date.now(),done:false}));add++;
  }
  return {add,mrg};
}

/* ===== Fabbisogno: calcolo di calorie e macro (formula di Mifflin-St Jeor) ===== */
const NACT=[[1.2,'Sedentario','poco movimento'],[1.375,'Leggero','1-3 allenamenti a settimana'],[1.55,'Moderato','3-5 allenamenti'],[1.725,'Intenso','6-7 allenamenti'],[1.9,'Molto intenso','lavoro fisico + sport']];
const NGOAL=[['lose','Dimagrire'],['keep','Mantenere'],['gain','Mettere massa']];
const NPACE=[['soft','Graduale'],['std','Normale']];
function nutCalc(){
  const m=S.me||{},n=m.nut;if(!n)return null;
  const wl=S.weights.length?S.weights[S.weights.length-1].kg:numv(m.weight),h=numv(m.height),a=numv(m.age);
  if(!wl||!h||!a)return {miss:true};
  const bmr=10*wl+6.25*h-5*a+(n.sex==='m'?5:-161),tdee=bmr*(n.act||1.375),minor=a<18;
  const goal=minor?'keep':n.goal,pace=n.pace==='soft'?.10:.15;
  let kcal=goal==='lose'?tdee*(1-pace):goal==='gain'?tdee*1.10:tdee,floored=false;
  const floor=n.sex==='m'?1500:1200;
  if(goal==='lose'&&kcal<floor){kcal=Math.min(floor,tdee);floored=true}
  kcal=Math.round(kcal/10)*10;
  const pg=Math.round(wl*(goal==='lose'?2:goal==='gain'?1.8:1.6)),fg=Math.round(Math.max(wl*.8,kcal*.25/9));
  const cg=Math.max(0,Math.round((kcal-pg*4-fg*9)/4));
  return {wl,bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,pg,fg,cg,water:Math.round(wl*35/100)/10,minor,goal,floored};
}
function nutriHTML(){
  const c=nutCalc(),head=`<div class="sec"><h2>Il tuo fabbisogno</h2></div>`;
  if(!c)return head+`<div class="card col"><p class="mute small">Calcola quante calorie e quanti macronutrienti ti servono ogni giorno, in base ai tuoi dati e al tuo obiettivo.</p><button class="btn" data-act="nutedit">${ic('flame',18)}Calcola il mio fabbisogno</button></div>`;
  if(c.miss)return head+`<div class="card col"><p class="mute small">Per il calcolo servono età, altezza e peso: completali nel profilo.</p><button class="btn ghost" data-act="editprof">${ic('edit',16)}Modifica profilo</button></div>`;
  const kc=c.pg*4+c.cg*4+c.fg*9||1,pp=Math.round(c.pg*400/kc),pf=Math.round(c.fg*900/kc),pc=100-pp-pf;
  const gl={lose:'per dimagrire con gradualità',keep:'per mantenere il peso',gain:'per mettere massa'}[c.goal];
  return head+`<div class="card col"><div><div class="bigk num">${c.kcal}</div><div class="mute small">kcal al giorno ${gl}</div></div>
  <div class="macro"><i style="width:${pp}%;background:var(--cyan)"></i><i style="width:${pc}%;background:var(--amber)"></i><i style="width:${pf}%;background:var(--pink)"></i></div>
  <div class="mrow"><div class="mbox"><b style="color:var(--cyan)">${c.pg}g</b><span>Proteine</span></div><div class="mbox"><b style="color:var(--amber)">${c.cg}g</b><span>Carboidrati</span></div><div class="mbox"><b style="color:var(--pink)">${c.fg}g</b><span>Grassi</span></div></div>
  <p class="small mute">Metabolismo basale ${c.bmr} kcal · consumo giornaliero stimato ${c.tdee} kcal · acqua circa ${nf(c.water,1)} L</p>
  ${c.minor?'<p class="small warn">Sei minorenne: ti mostro solo il mantenimento. Per cambiare peso chiedi al medico o a un nutrizionista.</p>':''}${c.floored?'<p class="small warn">Ho alzato il valore al minimo di sicurezza: non scendere sotto questa soglia senza un professionista.</p>':''}
  <button class="btn ghost" data-act="nutedit">${ic('edit',16)}Modifica dati</button><p class="tiny dim">È una stima basata su una formula standard, non un consiglio medico. Con patologie, gravidanza o disturbi alimentari rivolgiti a un medico o a un nutrizionista. Il calcolo è privato.</p></div>`;
}
function nutSheetBody(){
  const n=S.d.nut,opts=(arr,k,lab)=>`<div class="opt">${arr.map(x=>`<button class="${String(n[k])===String(x[0])?'on':''}" data-act="nset" data-k="${k}" data-v="${x[0]}">${x[1]}${lab&&x[2]?`<br><span class="tiny" style="font-weight:500">${x[2]}</span>`:''}</button>`).join('')}</div>`;
  return `<div class="col"><p class="small mute">Uso età, altezza e peso del tuo profilo (peso: l'ultima misura registrata).</p>
  <div class="kicker">Sesso (serve alla formula)</div>${opts([['m','Uomo'],['f','Donna']],'sex')}
  <div class="kicker">Quanto ti muovi</div>${opts(NACT,'act',1)}
  <div class="kicker">Obiettivo</div>${opts(NGOAL,'goal')}
  ${n.goal==='lose'?`<div class="kicker">Ritmo</div>${opts(NPACE,'pace')}`:''}
  <button class="btn block" data-act="nutsave">Calcola e salva</button></div>`;
}

  downloads={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}};
  await refreshStatus();if(S.fatal)return render();
  S.auth='in';if(S.status.member)startApp();render();
}
(async function init(){
  render();
  if(!CFG.url||!CFG.anonKey||/INSERISCI/.test(CFG.url+CFG.anonKey)||!window.supabase){S.fatal='cfg';return render()}
  sb=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&S.auth==='in')location.reload()});
  S.authMode='in';
  try{await bootAfterAuth()}catch(e){console.error(e);S.fatal='db';render()}
})();
