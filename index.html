<title>FIT LIFE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: stile app Fitness. Sfondo nero, titolo grande, anelli concentrici per calorie e macro, schede arrotondate, barra a tab traslucida. */
:root{
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --fg:#FFFFFF; --muted:#8E8E93; --line:#38383A;
  --seg-bg:#1C1C1E; --seg-on:#48484A;
  --ink:#FA114F; --ink-fg:#FFFFFF; --accent:#FA114F; --danger:#FF453A;
  --move:#FA114F; --exercise:#A6F51C; --stand:#19E5EE; --fat:#FFD60A;
  --red:#FA114F; --yellow:#FF9F0A; --blue:#0A84FF; --green:#30D158;
  --font-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,'Segoe UI',sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#EFEFF4; --fg:#000000; --muted:#6C6C70; --line:#D8D8DD;
  --seg-bg:#E3E3E8; --seg-on:#FFFFFF; --danger:#D70015;
  --ink:#F20F4A; --accent:#F20F4A; --move:#F20F4A; --exercise:#4E9E00; --stand:#00A3AD; --fat:#C99A00;
  --red:#F20F4A; --yellow:#E07B00; --blue:#0A6CDC; --green:#1FA84A; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#EFEFF4; --fg:#000000; --muted:#6C6C70; --line:#D8D8DD;
  --seg-bg:#E3E3E8; --seg-on:#FFFFFF; --danger:#D70015;
  --ink:#F20F4A; --accent:#F20F4A; --move:#F20F4A; --exercise:#4E9E00; --stand:#00A3AD; --fat:#C99A00;
  --red:#F20F4A; --yellow:#E07B00; --blue:#0A6CDC; --green:#1FA84A; color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(88px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{max-width:640px;margin:0 auto}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)} .sm{font-size:13px}
.num-big,.disp{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.02em}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax);padding:14px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--font-display);font-weight:800;font-size:28px;letter-spacing:.06em;line-height:1}
#screen{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
#view{display:flex;flex-direction:column;gap:14px;padding-top:4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font-family:var(--font-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1;margin-bottom:10px}
.card h3{font-size:16px;font-weight:700;line-height:1.25}
.stack{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.pad{padding:18px 4px}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--ink-fg);font-weight:600}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--line)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.wide{width:100%;justify-content:space-between}
.btn.wide:only-child,.btn.wide.c{justify-content:center}
.btn small{font-weight:500;opacity:.7}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.icon{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:transparent;border-radius:8px;color:var(--muted);flex:none}
.icon svg,.tab svg,.chk svg,.search svg,.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon:hover{background:var(--surface2)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{min-height:40px;border:0;background:transparent;border-radius:7px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--ink-fg)}

.datenav{display:flex;align-items:center;justify-content:space-between;gap:4px}
.datenav .d{flex:1;min-width:0;text-align:center;font-family:var(--font-display);font-weight:800;font-size:21px;text-transform:uppercase;letter-spacing:.03em;line-height:1.15}
.datenav .d button{display:block;width:100%;border:0;background:transparent;font:inherit;line-height:1.15;padding:0;text-transform:inherit;letter-spacing:inherit}
.datenav .d small{display:block;margin-top:3px;font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.datenav .icon[disabled]{opacity:.3}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px dashed var(--muted);border-radius:10px;padding:10px 12px;font-size:13px}
.banner .btn{flex:none}

.kcal{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.kcal .big{font-family:var(--font-display);font-weight:800;font-size:60px;line-height:.9;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.kcal .big small{display:block;font-size:14px;font-weight:600;letter-spacing:.08em;margin:8px 0 0;color:var(--muted)}
.kcal .side{white-space:nowrap;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:14px 0 4px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.bar.over i{background:var(--danger)}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.ring{text-align:center;min-width:0}
.ring svg{width:84px;height:84px;max-width:100%}
.ring .rv{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ring .rv b{color:var(--fg);font-size:15px}
.ring .rl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.fibre{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--muted)}
.fibre .bar{flex:1;margin:0;height:6px}
.fibre .bar i{background:var(--green)}

.meal{padding:0}
.meal-h{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 6px 16px}
.meal-h h3{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:19px}
.meal-h .k{color:var(--muted);font-size:13px;margin-left:8px;font-variant-numeric:tabular-nums}
.entry{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 16px;min-height:52px}
.entry .n{min-width:0;overflow-wrap:anywhere}
.entry .n small{display:block;color:var(--muted);font-size:12px}
.entry .r{flex:none;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.entry .r small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.empty{border-top:1px solid var(--line);padding:12px 16px;color:var(--muted);font-size:14px}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:46px}
.search svg{color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:16px;min-height:44px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
select,.field{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;font-size:16px;min-width:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.d{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:baseline}
.d.r{background:var(--red)}.d.y{background:var(--yellow)}.d.b{background:var(--blue)}.d.g{background:var(--green)}
.flist{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sheet .flist{border:0;border-radius:0;background:transparent}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 14px;min-height:56px}
.flist .frow:first-child{border-top:0}
.fn{min-width:0;overflow-wrap:anywhere;font-weight:500}
.fn small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.fn em{font-style:normal;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);border-radius:3px;padding:1px 4px;margin-left:6px;color:var(--muted)}
.fk{flex:none;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.fk b{font-size:16px;color:var(--fg)}
.fk small{display:block;font-size:12px;white-space:nowrap}

.field-row{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.form{display:flex;flex-direction:column;gap:14px}
.gwrap{display:flex;align-items:center;gap:8px}
.gwrap input{width:140px;min-height:56px;font-family:var(--font-display);font-weight:800;font-size:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px;text-align:right}
.gwrap span{font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--muted)}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;background:var(--surface2);border-radius:8px;padding:12px 6px;font-variant-numeric:tabular-nums}
.sum b{display:block;font-family:var(--font-display);font-size:24px;font-weight:800;line-height:1}
.sum span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.per100{font-size:13px;color:var(--muted)}

.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet-bd{position:absolute;inset:0;background:rgba(8,12,16,.55)}
.sheet{position:relative;width:100%;max-width:560px;max-height:88%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:16px 16px 0 0;
  padding:14px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sh-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.sh-h h2{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:24px;line-height:1.1;overflow-wrap:anywhere}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(8px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em}
.tab.on{color:var(--fg)}
.tab.on svg{stroke-width:2.6}

.exh{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin:-6px -8px 4px 0}
.exh .t{min-width:0}
.last{font-size:12px;color:var(--muted);margin:2px 0 8px;font-variant-numeric:tabular-nums}
.set{display:grid;grid-template-columns:24px 1fr 14px 1fr 44px 36px;align-items:center;gap:6px;margin-bottom:6px}
.set .sn{font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--muted);text-align:center}
.set .x{text-align:center;color:var(--muted)}
.num{min-width:0;width:100%;min-height:44px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.num.done{background:var(--surface2)}
.chk{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.set .icon{width:36px;height:36px}
.sethead{display:grid;grid-template-columns:24px 1fr 14px 1fr 44px 36px;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;margin-bottom:4px}
.plates{font-size:13px;color:var(--muted);min-height:0;margin:2px 0 8px}
.plates b{color:var(--fg);font-variant-numeric:tabular-nums}
.pl{display:inline-block;min-width:26px;padding:1px 6px;border-radius:12px;color:#fff;font-weight:700;font-size:12px;text-align:center;margin:0 2px;font-variant-numeric:tabular-nums}
.pl.p25{background:#C42B3C}.pl.p20{background:#1F5FB8}.pl.p15{background:#B58B00}.pl.p10{background:#1F8A52}.pl.p5{background:#6B7783}.pl.p2{background:#3C4650}.pl.p1{background:#3C4650}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-family:var(--font-display);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

.plh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.title-in{flex:1;min-width:0;border:1px solid transparent;border-bottom-color:var(--line);background:transparent;font-family:var(--font-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.03em;padding:6px 0;border-radius:0}
.pex{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding:6px 0}
.pex .pn{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.pex .pn small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.pex .num{width:52px;min-height:40px;font-size:16px}
.pex .num.w{width:70px}
.hist-day{border-top:1px solid var(--line);padding:12px 0}
.hist-day:first-of-type{border-top:0}
.hist-day button.hd{display:flex;width:100%;justify-content:space-between;align-items:flex-start;gap:10px;border:0;background:none;text-align:left;padding:0}
.hist-day .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.hist-day ul{margin:8px 0 0;padding:0;list-style:none;font-size:14px;display:flex;flex-direction:column;gap:6px}
.hist-day li span{color:var(--muted);font-variant-numeric:tabular-nums;display:block;font-size:13px}
.rec{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:9px 0;font-variant-numeric:tabular-nums}
.rec:first-of-type{border-top:0}
.rec span:last-child{font-weight:700;white-space:nowrap}

.tgt{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:4px}
.tgt div{min-width:0}
.tgt b{display:block;font-family:var(--font-display);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tgt span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.ch-line{fill:none;stroke:var(--fg);stroke-width:2;stroke-linejoin:round}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-t{fill:var(--muted);font:11px var(--font-body)}
.ch-pt{fill:var(--fg)}
.chart{width:100%;height:auto;display:block}
.wlist{margin-top:8px}
.wrow{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;padding-left:2px}
.wrow .icon{width:40px;height:40px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--ink-fg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;max-width:calc(100vw - 32px);text-align:center}
.toast[hidden]{display:none}
.rest{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:24;padding:0 max(16px,env(safe-area-inset-left,0px))}
.rest[hidden]{display:none}
.rest-in{max-width:640px;margin:0 auto 8px;background:var(--ink);color:var(--ink-fg);border-radius:10px;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px}
.rest-in .tm{font-family:var(--font-display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;min-width:64px;line-height:1}
.rest-in .lb{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.7;flex:1}
.rest-in button{min-height:36px;padding:0 10px;border-radius:6px;border:1px solid rgba(128,128,128,.5);background:transparent;color:inherit;font-weight:600;font-size:13px}

@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
@media (max-width:380px){.kcal .big{font-size:50px}.gwrap input{width:120px}}

/* ---- gruppo, avatar, spesa ---- */
.hr{display:flex;align-items:center;gap:10px}
.meb{width:44px;height:44px;border:0;background:transparent;padding:2px;border-radius:50%;flex:none}
.meb svg{width:100%;height:100%;display:block}
.hero{display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--ink-fg);border-radius:14px;padding:16px;position:relative;overflow:hidden;min-width:0}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;border:14px solid currentColor;opacity:.06;pointer-events:none}
.hav{border:0;background:transparent;padding:0;border-radius:50%;flex:none;line-height:0}
.hav svg{display:block;width:72px;height:72px}
.hmain{flex:1;min-width:0}
.hname{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hlvl{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:.03em;text-transform:uppercase;line-height:1.05}
.hero .bar{background:rgba(128,128,128,.35);margin:8px 0 4px;height:6px}
.hero .bar i{background:var(--ink-fg)}
.hsub{font-size:12px;opacity:.75}
.streak{flex:none;text-align:center;display:flex;flex-direction:column;align-items:center;gap:0;font-size:11px;line-height:1.1;opacity:.95}
.streak svg{width:22px;height:22px;fill:var(--yellow);stroke:var(--yellow);stroke-width:1.5}
.streak b{font-family:var(--font-display);font-size:30px;font-weight:800;line-height:1}
.streak span{opacity:.75}
.pg{display:flex;gap:14px;align-items:center}
.pg .hav svg{width:88px;height:88px}
.tgl{display:flex;gap:12px;align-items:flex-start;min-height:44px;cursor:pointer}
.tgl input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ink);flex:none}
.tgl span{font-weight:600}
.tgl small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.avprev{display:flex;justify-content:center;padding:6px 0}

const parseYmd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};

const ACTV=[[1.2,'Sedentario: poco movimento'],[1.375,'Leggero: 1-3 allenamenti a settimana'],[1.55,'Moderato: 3-5 allenamenti a settimana'],[1.725,'Alto: 6-7 allenamenti a settimana'],[1.9,'Molto alto: lavoro fisico e allenamenti']];

let core=null, days={};
const UI={mem:null,tab:'oggi',date:TODAY,wsub:'oggi',q:'',cat:'',sort:'n',sheet:null,confirm:null,exp:null};
function defaultCore(){return{v:1,demo:false,profile:{sex:'m',age:30,height:175,weight:72,activity:3,goal:'keep',kcal:''},weights:[],custom:[],customEx:[],plan:[]}}
function allFoods(){return core.custom.map(c=>Object.assign({custom:true,pg:0,pn:''},c)).concat(FOODS)}
function findFood(id){return allFoods().find(f=>f.id===id)}
function allEx(){return core.customEx.map(e=>Object.assign({},e)).concat(EXLIB)}
function exByName(n){return allEx().find(e=>e.n===n)}
function dayOf(d,create){if(!days[d]&&create)days[d]={meals:{b:[],l:[],d:[],s:[]},log:null};return days[d]}
function entry(f,g,demo){const e={id:uid(),fid:f.id,n:f.n,k:f.k,p:f.p,h:f.h,f:f.f,fi:f.fi||0,g:g};if(demo)e.demo=1;return e}
function em(e){const q=e.g/100;return{k:e.k*q,p:e.p*q,h:e.h*q,f:e.f*q,fi:(e.fi||0)*q}}
function dayTotals(d){const t={k:0,p:0,h:0,f:0,fi:0};const day=days[d];if(!day)return t;
  MEALS.forEach(m=>day.meals[m[0]].forEach(e=>{const x=em(e);t.k+=x.k;t.p+=x.p;t.h+=x.h;t.f+=x.f;t.fi+=x.fi}));return t}
function mealKcal(day,m){return day?day.meals[m].reduce((s,e)=>s+em(e).k,0):0}

function targets(){
  const p=core.profile, w=num(p.weight)||70, h=num(p.height)||170, a=num(p.age)||30;
  const bmr=10*w+6.25*h-5*a+(p.sex==='m'?5:-161);
  const tdee=bmr*ACTV[Math.min(5,Math.max(1,p.activity||3))-1][0];
  const minor=a<18;
  const adj=minor?0:({cut:-0.15,keep:0,bulk:0.10}[p.goal]||0);
  const floor=p.sex==='m'?1500:1200;
  const auto=Math.max(Math.round(tdee*(1+adj)/10)*10,floor);
  const cu=num(p.kcal);
  const kcal=cu>=800&&cu<=8000?Math.round(cu):auto;
  const prot=Math.round(w*({cut:2.0,keep:1.6,bulk:1.8}[p.goal]||1.6));
  const fat=Math.round(w*(p.goal==='bulk'?1.0:0.9));
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,auto,prot,fat,carb,fib:Math.round(kcal/1000*14),minor,custom:kcal!==auto};
}

/* ---------- salvataggio ---------- */
const LS='ghisa-v1';
const store={mode:'local',db:null,uid:null,user:null,canWrite:null,pubOK:false,note:'Salvataggio solo su questo dispositivo.'};
const dirty=new Set();let saveTimer=null,saving=false;
function localLoad(){try{const r=localStorage.getItem(LS);if(r){const o=JSON.parse(r);if(o&&o.core)return o}}catch(e){}return null}
function localSave(){try{localStorage.setItem(LS,JSON.stringify({core:core,days:days}))}catch(e){}}
function mark(k){_st=null;dirty.add(k);clearTimeout(saveTimer);saveTimer=setTimeout(flush,500);schedulePublish()}
function markDay(d){mark('d-'+d)}
function tidy(d){const x=days[d];if(x&&!x.log&&MEALS.every(m=>!x.meals[m[0]].length))delete days[d]}
async function flush(){
  if(saving){saveTimer=setTimeout(flush,300);return}
  saving=true;const keys=[...dirty];dirty.clear();
  try{
    keys.filter(k=>k!=='core').forEach(k=>tidy(k.slice(2)));
    if(store.mode==='db'){
      for(const k of keys){
        const ref=store.db.doc('data/users/'+store.uid+'/'+k);
        const data=k==='core'?core:days[k.slice(2)];
        if(data===undefined)await ref.delete();else await ref.set(clone(data));
      }
    }else localSave();
  }catch(e){
    store.mode='local';store.note='Salvataggio su account non riuscito: i dati restano su questo dispositivo.';
    localSave();toast('Salvataggio su account non riuscito. Dati tenuti su questo dispositivo.');
  }finally{saving=false}
}
async function initStore(){
  const lc=localLoad();
  if(lc){core=Object.assign(defaultCore(),lc.core);SHOP=core.shop||[];core.profile=Object.assign(defaultCore().profile,lc.core.profile);days=lc.days||{}}
  else{core=defaultCore();seedDemo();localSave()}
  render();
  try{
    if(!window.claude||!window.claude.use)return;
    const lim=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
    const got=await lim(Promise.all([window.claude.use('db'),window.claude.use('user')]),10000);
    const db=got[0],user=got[1];
    const id=user?await user.id():null;
    if(!db||!id)return;
    const snap=await lim(db.collection('data/users/'+id).get(),10000);
    store.db=db;store.uid=id;store.user=user;store.mode='db';SHOP=[];store.note='Salvataggio sul tuo account: ritrovi i dati su ogni dispositivo.';
    const docs=snap.docs.filter(d=>d.exists);
    const c=docs.find(d=>d.id==='core');
    if(c){
      core=Object.assign(defaultCore(),c.data());core.profile=Object.assign(defaultCore().profile,core.profile||{});
      days={};docs.forEach(d=>{if(d.id.indexOf('d-')===0)days[d.id.slice(2)]=d.data()});
    }else{mark('core');Object.keys(days).forEach(markDay)}
    try{store.canWrite=await user.can('data.write')}catch(e){}
    store.pubOK=store.canWrite!==false;
    render();subscribeGroup();
    if(store.pubOK)publishMe();
  }catch(e){/* resta il salvataggio locale */}
}

function weekDays(d){const dow=(parseYmd(d).getDay()+6)%7,mon=addDays(d,-dow);return Array.from({length:7},(_,i)=>addDays(mon,i))}
function miniRing(pct,color){
  const R=15,C=2*Math.PI*R,p=Math.max(0,Math.min(1,pct));
  return `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="${R}" fill="none" stroke-width="6" stroke-opacity=".22" style="stroke:${color}"/>`+(p>0.004?`<circle cx="20" cy="20" r="${R}" fill="none" stroke-width="6" stroke-linecap="round" style="stroke:${color}" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 20 20)"/>`:'')+`</svg>`;
}
function dateNav(kind){
  const t=targets(),L=['L','M','M','G','V','S','D'],isT=UI.date===TODAY,dt=parseYmd(UI.date);
  let h=`<div class="wkbar">`+weekDays(UI.date).map((d,i)=>{
    const fut=d>TODAY,sel=d===UI.date;let pct,col;
    if(kind==='w'){const x=days[d];pct=x&&x.log&&logStats(x.log).done>0?1:0;col='var(--exercise)'}
    else{pct=dayTotals(d).k/(t.kcal||1);col='var(--move)'}
    return `<button class="wkd ${sel?'sel':''}" data-act="pickday" data-d="${d}" ${fut?'disabled':''} aria-pressed="${sel}" aria-label="${cap(wdFmt.format(parseYmd(d)))} ${dmFmt.format(parseYmd(d))}"><span class="wl">${L[i]}</span>${miniRing(pct,col)}</button>`}).join('')+`</div>`;
  h+=`<div class="datel"><b>${isT?'Oggi':cap(wdFmt.format(dt))}, ${dmFmt.format(dt)}</b>${isT?'':'<button data-act="dtoday">Vai a oggi</button>'}</div>`;
  return h;
}
function demoBanner(){return `<div class="banner"><span>Stai vedendo dati di esempio. Sostituiscili con i tuoi.</span><button class="btn sm ghost" data-act="rmdemo">Rimuovi esempi</button></div>`}
function actRings(tot,t){
  const rs=[[44,'var(--move)',tot.k/(t.kcal||1)],[32,'var(--exercise)',tot.p/(t.prot||1)],[20,'var(--stand)',tot.h/(t.carb||1)]];
  return `<svg viewBox="0 0 100 100" role="img" aria-label="Anelli di calorie, proteine e carboidrati">`+rs.map(r=>{
    const C=2*Math.PI*r[0],p=Math.max(0,Math.min(1,r[2]));
    return `<circle cx="50" cy="50" r="${r[0]}" fill="none" stroke-width="11" stroke-opacity=".22" style="stroke:${r[1]}"/>`+(p>0.004?`<circle class="rg" cx="50" cy="50" r="${r[0]}" fill="none" stroke-width="11" stroke-linecap="round" pathLength="1" style="stroke:${r[1]};--g:${r[1]}" stroke-dasharray="${p.toFixed(4)} 1" transform="rotate(-90 50 50)"/>`:'');
  }).join('')+`</svg>`;
}
function vOggi(){
  const d=UI.date,t=targets(),tot=dayTotals(d),day=days[d];
  const left=t.kcal-tot.k,over=left<0;
  const stat=(c,l,v,tg,u)=>`<div class="as ${c}"><div class="al">${l}</div><div class="av">${fmt(v)}<span class="of">/${fmt(tg)}</span><small>${u}</small></div><div class="rm">${tg-v>=0?'mancano '+fmt(tg-v):'oltre di '+fmt(v-tg)} ${u.toLowerCase()}</div></div>`;
  let h=dateNav()+`<section class="card"><div class="act">${actRings(tot,t)}<div class="acts">${stat('m','Calorie',tot.k,t.kcal,'KCAL')}${stat('e','Proteine',tot.p,t.prot,'G')}${stat('s','Carboidrati',tot.h,t.carb,'G')}</div></div>
    <div class="act2">${stat('f','Grassi',tot.f,t.fat,'G')}${stat('g','Fibre',tot.fi,t.fib,'G')}</div>
    <p class="left ${over?'over':''}">${over?fmt(-left)+' kcal oltre l\'obiettivo':fmt(left)+' kcal rimaste per oggi'}</p></section>`+eatCard()+heroCard();
  MEALS.forEach(m=>{
    const list=day?day.meals[m[0]]:[];
    h+=`<section class="card meal"><div class="meal-h"><h3>${m[1]}<span class="k">${fmt(mealKcal(day,m[0]))} kcal</span></h3>
      <button class="icon" data-act="addfood" data-m="${m[0]}" aria-label="Aggiungi a ${m[1]}">${I.plus}</button></div>`;
    h+=list.length?list.map(e=>{const x=em(e);return `<button class="entry" data-act="editentry" data-id="${e.id}"><span class="n">${esc(e.n)}<small>${fm(e.g)} g</small></span><span class="r">${fmt(x.k)} kcal<small>P ${fm(x.p)} · C ${fm(x.h)} · G ${fm(x.f)}</small></span></button>`}).join(''):`<div class="empty">Nessun alimento. Tocca + per aggiungerne uno.</div>`;
    h+=`</section>`;
  });
  const log=day&&day.log;
  h+=`<section class="card"><h2>Allenamento</h2>`;
  if(log){const s=logStats(log);h+=`<p><b>${esc(log.name)}</b></p><p class="muted sm">${log.ex.length} esercizi · ${s.done}/${s.sets} serie · ${fmt(s.vol)} kg di volume</p>
    <div class="btnrow"><button class="btn sm" data-act="gowork">Apri il registro</button></div>`}
  else h+=`<p class="muted">Nessun allenamento registrato per questa data.</p><div class="btnrow"><button class="btn sm" data-act="gowork">Registra allenamento</button></div>`;
  return h+`</section>`;
}

function filterFoods(q,cat,sort){
  const nq=norm(q.trim());
  let l=allFoods().filter(f=>(!cat||f.c===cat)&&(!nq||norm(f.n).includes(nq)));
  const key={k:'k',p:'p',h:'h',f:'f',fi:'fi'}[sort];
  if(key)l.sort((a,b)=>b[key]-a[key]||a.n.localeCompare(b.n,'it'));else l.sort((a,b)=>a.n.localeCompare(b.n,'it'));
  return l;
}
function foodRows(l,act){
  if(!l.length)return '<p class="muted pad">Nessun alimento trovato. Prova un altro nome oppure aggiungilo tu.</p>';
  return l.map(f=>`<button class="frow" data-act="${act}" data-fid="${esc(f.id)}"><span class="fn">${esc(f.n)}${f.custom?'<em>personale</em>':''}<small>${esc(f.c||'')}</small></span>
    <span class="fk"><b>${fmt(f.k)}</b> kcal<small><i class="d pr"></i>${fm(f.p)} <i class="d ca"></i>${fm(f.h)} <i class="d fa"></i>${fm(f.f)}</small></span></button>`).join('');
}
function catChips(active,act){
  return `<button class="chip ${!active?'on':''}" data-act="${act}" data-v="">Tutti</button>`+CATS.map(c=>`<button class="chip ${active===c?'on':''}" data-act="${act}" data-v="${esc(c)}">${esc(c)}</button>`).join('');
}

/* allenamento */
function logStats(log){let vol=0,sets=0,done=0;log.ex.forEach(e=>e.sets.forEach(s=>{sets++;if(s.x){done++;if(e.t==='w')vol+=(num(s.a)||0)*(num(s.b)||0)}}));return{vol:vol,sets:sets,done:done}}
function lastSets(name,before){
  const ks=Object.keys(days).filter(k=>k<before&&days[k].log).sort().reverse();
  for(const k of ks){const e=days[k].log.ex.find(x=>x.n===name);if(e){const s=e.sets.filter(x=>x.a!==''||x.b!=='');if(s.length)return s.map(x=>({a:x.a,b:x.b}))}}
  return [];
}
function newLogEx(src,date){
  const last=lastSets(src.n,date),cnt=src.s||3;
  return{n:src.n,g:src.g,t:src.t,bb:!!src.bb,s:src.s||0,r:src.r||'',
    sets:Array.from({length:cnt},(_,j)=>{const l=last[j]||last[last.length-1];return{a:l?l.a:'',b:l?l.b:'',x:false}})};
}
function platesFor(kg){
  if(!(kg>20))return null;
  let side=(kg-20)/2;const out=[];
  [25,20,15,10,5,2.5,1.25].forEach(p=>{while(side>=p-1e-9){out.push(p);side-=p}});
  return{out:out,rest:side};
}
function platesHtml(e){
  if(!e.bb)return '';
  const top=Math.max(0,...e.sets.map(s=>num(s.a)||0));
  const p=platesFor(top);
  if(!p)return top>0?`<span>Solo bilanciere da 20 kg.</span>`:'';
  const cls=v=>v>=25?'p25':v>=20?'p20':v>=15?'p15':v>=10?'p10':v>=5?'p5':v>=2.5?'p2':'p1';
  return `Per lato, con bilanciere da 20 kg (${fm(top)} kg): `+p.out.map(v=>`<span class="pl ${cls(v)}">${fm(v)}</span>`).join('')+(p.rest>0.01?` <span>(circa)</span>`:'');
}
function setRows(e,i){
  const w=e.t==='w';
  let h=`<div class="sethead"><span>#</span><span>${w?'kg':'min'}</span><span></span><span>${w?'rip':'km'}</span><span>fatta</span><span></span></div>`;
  e.sets.forEach((s,j)=>{
    h+=`<div class="set" data-i="${i}" data-j="${j}"><span class="sn">${j+1}</span>
    <input class="num ${s.x?'done':''}" inputmode="decimal" data-in="seta" value="${esc(s.a)}" placeholder="${w?'kg':'min'}" aria-label="${w?'Chili':'Minuti'} serie ${j+1}">
    <span class="x">×</span>
    <input class="num ${s.x?'done':''}" inputmode="decimal" data-in="setb" value="${esc(s.b)}" placeholder="${w?esc(e.r||'rip'):'km'}" aria-label="${w?'Ripetizioni':'Chilometri'} serie ${j+1}">
    <button class="chk ${s.x?'on':''}" data-act="togset" aria-pressed="${s.x}" aria-label="Serie ${j+1} completata">${I.chk}</button>
    <button class="icon" data-act="delset" aria-label="Elimina serie ${j+1}">${I.x}</button></div>`;
  });
  return h;
}
function vWork(){
  const subs=[['oggi','Registro'],['plan','Scheda'],['hist','Storico']];
  return `<div class="seg">${subs.map(s=>`<button class="${UI.wsub===s[0]?'on':''}" data-act="wsub" data-v="${s[0]}">${s[1]}</button>`).join('')}</div>`+
    (UI.wsub==='oggi'?wToday():UI.wsub==='plan'?wPlan():wHist());
}
function wToday(){
  const d=UI.date,day=days[d],log=day&&day.log;

    if(core.plan.length)h+=`<p class="muted">Scegli una sessione della tua scheda.</p><div class="stack">`+core.plan.map((s,i)=>`<button class="btn ghost wide" data-act="startsess" data-i="${i}"><span>${esc(s.name)}</span><small>${s.ex.length} esercizi</small></button>`).join('')+`</div>`;
    else h+=`<p class="muted">Non hai ancora una scheda. Creane una nella sezione Scheda oppure parti con un allenamento libero.</p>`;

  }
  const s=logStats(log);
  h+=`<section class="card"><h2 style="margin-bottom:12px">${esc(log.name)}</h2><div class="stats"><div><b id="st-ex">${log.ex.length}</b><span>Esercizi</span></div><div><b id="st-sets">${s.done}/${s.sets}</b><span>Serie fatte</span></div><div><b id="st-vol">${fmt(s.vol)}</b><span>Volume kg</span></div></div></section>`;

    ${last.length?`<div class="last">Ultima volta: ${last.map(x=>esc(x.a||'-')+(e.t==='w'?' × '+esc(x.b||'-'):' min')).join(' · ')}</div>`:''}
    ${setRows(e,i)}<div class="plates" id="pl-${i}">${platesHtml(e)}</div>
    <button class="btn sm ghost" data-act="addset" data-i="${i}">${I.plus}Serie</button></section>`;

function wPlan(){

  core.plan.forEach((s,i)=>{
    h+=`<section class="card"><div class="plh"><input class="title-in" data-in="sname" data-i="${i}" value="${esc(s.name)}" aria-label="Nome sessione">${s.demo?'<span class="tag">Esempio</span>':''}</div>`;
    h+=s.ex.map((e,j)=>`<div class="pex"><span class="pn">${esc(e.n)}<small>${esc(e.g)}</small></span>${e.t==='w'?`<input class="num" inputmode="numeric" data-in="psets" data-i="${i}" data-j="${j}" value="${e.s}" aria-label="Serie"><span class="muted">×</span><input class="num w" data-in="preps" data-i="${i}" data-j="${j}" value="${esc(e.r)}" aria-label="Ripetizioni">`:'<span class="muted sm">a tempo</span>'}<button class="icon" data-act="pdelex" data-i="${i}" data-j="${j}" aria-label="Rimuovi ${esc(e.n)}">${I.x}</button></div>`).join('');
    h+=`<div class="btnrow"><button class="btn sm ghost" data-act="addex" data-t="plan" data-i="${i}">${I.plus}Esercizio</button><button class="btn sm danger" data-act="pdelsess" data-i="${i}">${UI.confirm==='ps'+i?'Tocca ancora per eliminare':'Elimina sessione'}</button></div></section>`;
  });
  return h+`<button class="btn" data-act="newsess">${I.plus}Nuova sessione</button>`;
}
function histKeys(){return Object.keys(days).filter(k=>days[k].log&&days[k].log.ex.length).sort().reverse()}
function wHist(){
  const ks=histKeys();
  if(!ks.length)return `<section class="card"><h2>Storico</h2><p class="muted">Quando completi un allenamento lo ritrovi qui, con volume e serie.</p></section>`;
  let h=`<section class="card"><h2>Allenamenti</h2>`;
  ks.slice(0,40).forEach(k=>{
    const lg=days[k].log,s=logStats(lg),dt=parseYmd(k),open=UI.exp===k;
    h+=`<div class="hist-day"><button class="hd" data-act="exp" data-d="${k}" aria-expanded="${open}"><span><b>${cap(wdFmt.format(dt))} ${shortFmt.format(dt)}</b><br><span class="muted sm">${esc(lg.name)}</span></span><span class="v">${fmt(s.vol)} kg<br><span class="muted sm" style="font-weight:400">${s.done}/${s.sets} serie</span></span></button>`;
    if(open)h+=`<ul>`+lg.ex.map(e=>`<li>${esc(e.n)}<span>${e.sets.filter(x=>x.x).map(x=>e.t==='w'?esc(x.a||0)+' × '+esc(x.b||0):esc(x.a||0)+' min').join(' · ')||'nessuna serie completata'}</span></li>`).join('')+`</ul><div class="btnrow"><button class="btn sm ghost" data-act="gotodate" data-d="${k}">Apri nel registro</button></div>`;
    h+=`</div>`;
  });
  h+=`</section>`;
  const rec={};
  ks.forEach(k=>days[k].log.ex.forEach(e=>{if(e.t!=='w')return;e.sets.forEach(s=>{const kg=num(s.a),rp=num(s.b);if(s.x&&kg>0&&rp>0){const r=rec[e.n];if(!r||kg>r.kg||(kg===r.kg&&k>r.d))rec[e.n]={kg:kg,rp:rp,d:k}}})}));
  const rl=Object.keys(rec).sort((a,b)=>rec[b].d.localeCompare(rec[a].d)||a.localeCompare(b,'it')).slice(0,12);
  if(rl.length)h+=`<section class="card"><h2>Carichi massimi</h2>`+rl.map(n=>`<div class="rec"><span>${esc(n)}</span><span>${fm(rec[n].kg)} kg × ${fm(rec[n].rp)}</span></div>`).join('')+`</section>`;
  return h;
}

function weightChart(){
  const w=core.weights.slice(-30);
  if(w.length<2)return '<p class="muted">Registra almeno due pesate per vedere l\'andamento.</p>';
  const W=320,H=150,pl=36,pr=10,pt=12,pb=24;
  const vals=w.map(x=>x.kg),mn=Math.min(...vals),mx=Math.max(...vals);
  const lo=mx-mn<1?mn-.5:mn,hi=mx-mn<1?mx+.5:mx,pad=(hi-lo)*.15,a=lo-pad,b=hi+pad;
  const X=i=>pl+(W-pl-pr)*i/(w.length-1),Y=v=>pt+(H-pt-pb)*(1-(v-a)/(b-a));
  const path=w.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.kg).toFixed(1)).join(' ');
  const last=w[w.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento del peso corporeo">
  <line class="ch-grid" x1="${pl}" x2="${W-pr}" y1="${Y(mx).toFixed(1)}" y2="${Y(mx).toFixed(1)}"/><line class="ch-grid" x1="${pl}" x2="${W-pr}" y1="${Y(mn).toFixed(1)}" y2="${Y(mn).toFixed(1)}"/>
  <text class="ch-t" x="${pl-6}" y="${(Y(mx)+4).toFixed(1)}" text-anchor="end">${fm(mx)}</text><text class="ch-t" x="${pl-6}" y="${(Y(mn)+4).toFixed(1)}" text-anchor="end">${fm(mn)}</text>
  <path class="ch-line" d="${path}"/><circle class="ch-pt" cx="${X(w.length-1).toFixed(1)}" cy="${Y(last.kg).toFixed(1)}" r="4.5"/>
  <text class="ch-t" x="${pl}" y="${H-6}">${shortFmt.format(parseYmd(w[0].d))}</text><text class="ch-t" x="${W-pr}" y="${H-6}" text-anchor="end">${shortFmt.format(parseYmd(last.d))}</text></svg>`;
}

let toastT=null;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}
let restT=null,restEnd=0;
const mmss=s=>Math.floor(s/60)+':'+z2(s%60);
function startRest(sec){
  clearInterval(restT);restEnd=Date.now()+sec*1000;
  const r=$('#rest');r.hidden=false;
  r.innerHTML=`<div class="rest-in"><span class="tm" id="rt">${mmss(sec)}</span><span class="lb">Recupero</span><button data-act="rest" data-v="60">60 s</button><button data-act="rest" data-v="90">90 s</button><button data-act="rest" data-v="150">150 s</button><button data-act="restoff" aria-label="Chiudi timer">${I.x}</button></div>`;
  restT=setInterval(()=>{const left=Math.ceil((restEnd-Date.now())/1000);const t=$('#rt');
    if(left<=0){clearInterval(restT);restT=null;if(t)t.textContent='Via!';try{if(navigator.vibrate)navigator.vibrate(250)}catch(e){}}
    else if(t)t.textContent=mmss(left)},250);
}
function stopRest(){clearInterval(restT);restT=null;const r=$('#rest');r.hidden=true;r.innerHTML=''}
function twoStep(key,fn){
  if(UI.confirm===key){UI.confirm=null;fn();return}
  UI.confirm=key;render();
  setTimeout(()=>{if(UI.confirm===key){UI.confirm=null;render()}},3500);
}

function refreshWorkNums(i){
  const log=curLog();if(!log)return;

  const a=$('#st-sets'),b=$('#st-vol');if(a)a.textContent=s.done+'/'+s.sets;if(b)b.textContent=fmt(s.vol);

let _st=null;
function dayInfo(d,tg){
  const x=days[d];if(!x)return{pt:0,flags:0};
  let pt=0,flags=0;const n=MEALS.reduce((s,m)=>s+x.meals[m[0]].length,0);
  if(n>=2){flags|=1;pt+=5;if(dayTotals(d).p>=0.9*tg.prot)pt+=5}
  if(x.log&&logStats(x.log).done>0){flags|=2;pt+=15}
  return{pt:pt,flags:flags};
}
function myStats(){
  if(_st)return _st;
  const tg=targets();let all=0,p7=0;const week=[];
  Object.keys(days).forEach(d=>{all+=dayInfo(d,tg).pt});
  for(let i=6;i>=0;i--){const x=dayInfo(addDays(TODAY,-i),tg);p7+=x.pt;week.push(x.flags)}
  let streak=0,i=dayInfo(TODAY,tg).flags?0:1;
  for(;i<400;i++){if(dayInfo(addDays(TODAY,-i),tg).flags)streak++;else break}
  const lvl=level(all);
  _st={all:all,p7:p7,week:week,streak:streak,lvl:lvl,next:lvl<LV.length-1?LV[lvl+1]:null};
  return _st;
}

function memberName(m){return (m&&m.nick)||(m&&PROF[m.id]&&PROF[m.id].name)||'Amico'}
function bestSet(e){
  if(e.t!=='w'){let mn=0;e.sets.forEach(s=>{if(s.x)mn+=num(s.a)||0});return mn?fm(mn)+' min':''}
  let b=null;e.sets.forEach(s=>{const kg=num(s.a),rp=num(s.b);if(s.x&&kg>=0&&rp>0&&(!b||kg>b.kg||(kg===b.kg&&rp>b.rp)))b={kg:kg,rp:rp}});
  return b?(b.kg?fm(b.kg)+' kg × '+fm(b.rp):fm(b.rp)+' rip'):'';
}
function buildSummary(){
  const p=core.profile,st=myStats(),sh=p.share||{},demo=core.demo;
  const o={nick:p.nick||'',av:myAv(),lvl:demo?0:st.lvl,pts:demo?0:st.all,pts7:demo?0:st.p7,streak:demo?0:st.streak,d:TODAY,week:demo?[0,0,0,0,0,0,0]:st.week,sh:{m:!!sh.m,w:!!sh.w,p:!!sh.p}};
  if(demo)return o;
  const day=days[TODAY];
  if(sh.m){
    const t=dayTotals(TODAY);o.today={k:Math.round(t.k),p:Math.round(t.p),h:Math.round(t.h),f:Math.round(t.f)};
    o.meals=[];if(day)MEALS.forEach(m=>day.meals[m[0]].forEach(e=>{if(o.meals.length<30)o.meals.push([m[0],e.n,Math.round(e.g),Math.round(em(e).k)])}));
  }
  if(sh.w&&day&&day.log){const s=logStats(day.log);o.wk={name:day.log.name,sets:s.done,vol:Math.round(s.vol),ex:day.log.ex.slice(0,10).map(e=>[e.n,bestSet(e)])}}
  if(sh.p&&core.weights.length>1){const w=core.weights;o.dw=Math.round((w[w.length-1].kg-w[Math.max(0,w.length-5)].kg)*10)/10}
  return o;
}

/* ---------- scrivi cosa hai mangiato: riconoscimento e calcolo automatico ---------- */
const EAT={txt:'',items:[],adj:{},est:{},meal:null,busy:false};
const NUMW={un:1,uno:1,una:1,mezzo:.5,mezza:.5,due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,otto:8,nove:9,dieci:10};
const STOPW=new Set(['di','del','della','dello','dei','degli','delle','da','con','al','alla','il','lo','la','le','i','gli','un','una','uno','fetta','fette','vasetto','vasetti','tazza','tazze','bicchiere','bicchieri','cucchiaio','cucchiai','cucchiaino','cucchiaini','porzione','porzioni','scatoletta','scatolette','manciata','manciate','pezzo','pezzi','po','ho','mangiato','bevuto','circa','abbondante','grammi','gr','g','kg','ml','cl','l','litri','litro','paio','e','in','a','per','colazione','pranzo','cena','spuntino','dell','dall','all','nell','sull','d','mezzo','mezza','due','tre','quattro','cinque','sei','sette','otto','nove','dieci']);
const UNITF={g:1,gr:1,grammi:1,kg:1000,ml:1,cl:10,l:1000,litri:1000,litro:1000};
function eroot(w){return w.length>3?w.replace(/[aeio]$/,''):w}
function etok(s){return norm(s).split(/[^a-z0-9]+/).filter(Boolean)}

function parseSeg(seg){
  const t=norm(seg).replace(/(\d),(\d)/g,'$1.$2');
  let grams=null,count=null,rest=t;
  const m=t.match(/(\d+(?:\.\d+)?)\s*(kg|gr|g|grammi|ml|cl|l|litri|litro)?(?![a-z])/);
  if(m){
    const n=parseFloat(m[1]);
    if(m[2])grams=n*UNITF[m[2]];else count=n;
    rest=t.replace(m[0],' ');
  }else{
    const tk=etok(t);
    if(tk.length&&NUMW[tk[0]]!=null){count=NUMW[tk[0]];if(tk[0]==='un'&&tk[1]==='paio')count=2}
    else if(tk.indexOf('mezzo')>=0||tk.indexOf('mezza')>=0)count=.5;
    else if(tk.some(x=>NUMW[x]!=null&&x!=='un'&&x!=='uno'&&x!=='una'))count=NUMW[tk.find(x=>NUMW[x]!=null&&x!=='un'&&x!=='uno'&&x!=='una')];
  }
  const tokens=etok(rest).filter(x=>!STOPW.has(x)&&!/^\d+$/.test(x));
  if(!tokens.length)return null;
  return{seg:seg.trim(),tokens:tokens,gramsIn:grams,count:count==null?1:count};
}
function candFor(tokens){
  const rs=tokens.map(eroot),cooked=tokens.some(x=>/^cott/.test(x));
  const out=[];
  allFoods().forEach(f=>{
    const ft=etok(f.n).filter(x=>!STOPW.has(x)).map(eroot);let hit=0;
    rs.forEach(r=>{if(ft.some(x=>x===r||(r.length>=4&&x.indexOf(r)===0)||(x.length>=4&&r.indexOf(x)===0)))hit++});
    if(!hit)return;
    const fr=hit/rs.length;if(fr<.6)return;
    let sc=fr*10-ft.length*.3;
    if(ft[0]&&(ft[0]===rs[0]||(rs[0].length>=4&&ft[0].indexOf(rs[0])===0)))sc+=1.5;
    if(ft.length===rs.length&&hit===rs.length)sc+=2;
    if(f.custom||f.prod)sc+=1;
    const isCrude=/crud/.test(norm(f.n)),isCooked=/cott/.test(norm(f.n));
    if(!cooked){if(isCrude)sc+=.6;if(isCooked)sc-=.6}else if(isCooked)sc+=.6;
    out.push({f:f,sc:sc});
  });
  return out.sort((a,b)=>b.sc-a.sc).slice(0,6).map(x=>x.f);
}
function eatBuild(txt){
  const segs=norm(txt).split(/\s*(?:,|;|\+|\n|\se\s|\scon\s)\s*/).map(s=>s.trim()).filter(Boolean);
  const items=[];
  segs.forEach(seg=>{
    const p=parseSeg(seg);if(!p)return;
    const adj=EAT.adj[p.seg]||{};
    let cands=candFor(p.tokens),food=null;
    if(cands.length){food=(adj.fid&&cands.find(c=>c.id===adj.fid))||cands[0]}
    else if(EAT.est[p.seg])food=EAT.est[p.seg];
    let grams=null,assumed=false;
    if(food){
      if(adj.g>0)grams=adj.g;
      else if(p.gramsIn!=null)grams=p.gramsIn;
      else{grams=p.count*(food.pg>0?food.pg:100)*(/^mezz/.test(food.pn||'')?2:1);assumed=!(food.pg>0)}
    }
    items.push({seg:p.seg,tokens:p.tokens,cands:cands,food:food,grams:grams,assumed:assumed});
  });
  return items;
}
function eatTotals(items){
  const a={k:0,p:0,h:0,f:0,fi:0};
  items.forEach(it=>{if(it.food&&it.grams>0){const q=it.grams/100;a.k+=it.food.k*q;a.p+=it.food.p*q;a.h+=it.food.h*q;a.f+=it.food.f*q;a.fi+=(it.food.fi||0)*q}});
  return a;
}
function remainBlock(add,base){
  const t=targets(),b=base||dayTotals(UI.date);
  const rows=[['k','Calorie','kcal','m',t.kcal],['p','Proteine','g','e',t.prot],['h','Carboidrati','g','s',t.carb],['f','Grassi','g','f',t.fat]];
  return `<div class="remb"><div class="remh">Dopo questo pasto ti restano</div>`+rows.map(r=>{
    const left=r[4]-(b[r[0]]+add[r[0]]);
    return `<div class="remr ${r[3]}"><span>${r[1]}</span><b>${left>=0?fmt(left):'+'+fmt(-left)}<small>${r[2]}</small></b><em>${left>=0?'mancano':'oltre'}</em></div>`;
  }).join('')+`</div>`;
}
function eatRow(it,i){
  if(!it.food){
    return `<div class="eitem miss"><span>«${esc(it.seg)}» non è nell'elenco.</span>${SAMPLE?`<button class="btn sm ghost" data-act="eatest" data-i="${i}">${EAT.busy===i?'Calcolo…':'Stima con Claude'}</button>`:'<span class="muted sm">Aggiungilo dalla scheda Alimenti.</span>'}</div>`;
  }
  const k=it.food.k*it.grams/100;
  return `<div class="eitem"><select class="esel" data-chg="eatsel" data-i="${i}" aria-label="Alimento riconosciuto">${(it.cands.length?it.cands:[it.food]).map(c=>`<option value="${esc(c.id)}" ${c.id===it.food.id?'selected':''}>${esc(c.n)}</option>`).join('')}</select>
  <div class="ei2"><input class="num" inputmode="decimal" value="${fm(it.grams)}" data-in="eatg" data-i="${i}" aria-label="Grammi"><span>g</span><b id="ek${i}">${fmt(k)} kcal</b></div>
  ${it.assumed?'<small class="muted">Porzione stimata di 100 g: correggi i grammi se serve.</small>':''}</div>`;
}
function eatSumHtml(){
  const tot=eatTotals(EAT.items);
  if(!(tot.k>0||EAT.items.some(i=>i.food)))return '';
  return `<div class="sum"><div><b>${fmt(tot.k)}</b><span>kcal</span></div><div><b>${fm(tot.p)}</b><span>Prot</span></div><div><b>${fm(tot.h)}</b><span>Carb</span></div><div><b>${fm(tot.f)}</b><span>Grassi</span></div></div>`+remainBlock(tot);
}
function eatPreview(){
  if(!EAT.items.length)return `<p class="muted sm">Scrivi quello che hai mangiato, anche più cose insieme. Riconosco gli alimenti, calcolo calorie e macro e ti dico quanto ti manca.</p>`;
  const ok=EAT.items.some(i=>i.food&&i.grams>0);
  return `<div class="elist">${EAT.items.map(eatRow).join('')}</div><div id="eatsum">${eatSumHtml()}</div>
  ${ok?`<div class="eatact"><select id="eatmeal" data-chg="eatmeal" aria-label="Pasto">${MEALS.map(m=>`<option value="${m[0]}" ${(EAT.meal||defaultMeal())===m[0]?'selected':''}>${m[1]}</option>`).join('')}</select><button class="btn" data-act="eatadd">Aggiungi al diario</button></div>`:''}`;
}
function eatCard(){
  if(UI.date>TODAY)return '';
  return `<section class="card eat"><h2>Cosa hai mangiato?</h2>
  <input id="eattxt" class="field" placeholder="es. 2 uova, 80 g di pasta e una mela" autocomplete="off" data-in="eattxt" value="${esc(EAT.txt)}" aria-label="Scrivi cosa hai mangiato">
  <div id="eatprev">${eatPreview()}</div></section>`;
}
function eatRefresh(){const el=$('#eatprev');if(el)el.innerHTML=eatPreview()}
function eatUpdateSums(i){
  const it=EAT.items[i],k=$('#ek'+i);
  if(it&&k&&it.food)k.textContent=fmt(it.food.k*it.grams/100)+' kcal';
  const s=$('#eatsum');if(s)s.innerHTML=eatSumHtml();
}
Object.assign(INP,{
  eattxt(t){EAT.txt=t.value;EAT.items=eatBuild(t.value);eatRefresh()},
  eatg(t){
    const i=+t.dataset.i,it=EAT.items[i];if(!it)return;
    const g=num(t.value);if(!(g>0&&g<=5000))return;
    it.grams=g;it.assumed=false;EAT.adj[it.seg]=Object.assign(EAT.adj[it.seg]||{},{g:g});eatUpdateSums(i);
  }
});
Object.assign(CHG,{
  eatsel(t){const it=EAT.items[+t.dataset.i];if(!it)return;EAT.adj[it.seg]=Object.assign(EAT.adj[it.seg]||{},{fid:t.value});delete EAT.adj[it.seg].g;EAT.items=eatBuild(EAT.txt);eatRefresh()},
  eatmeal(t){EAT.meal=t.value}
});
Object.assign(ACT,{
  eatadd(){
    const meal=EAT.meal||defaultMeal(),day=dayOf(UI.date,true);let n=0;
    EAT.items.forEach(it=>{if(it.food&&it.grams>0){day.meals[meal].push(entry(it.food,it.grams));n++}});
    if(!n)return;
    markDay(UI.date);EAT.txt='';EAT.items=[];EAT.adj={};
    const t=targets(),tot=dayTotals(UI.date),lk=t.kcal-tot.k,lp=t.prot-tot.p;
    render();
    toast(lk>=0?'Aggiunto. Restano '+fmt(lk)+' kcal'+(lp>0?' e '+fmt(lp)+' g di proteine':''):'Aggiunto. Sei oltre di '+fmt(-lk)+' kcal');
  },
  async eatest(t){
    const i=+t.dataset.i,it=EAT.items[i];if(!it||!SAMPLE||EAT.busy!==false)return;
    EAT.busy=i;eatRefresh();
    try{
      const r=await SAMPLE.json('Stima i valori nutrizionali medi per 100 g di questo alimento o piatto: "'+it.seg+'". Rispondi solo con un oggetto JSON {"nome": nome breve in italiano, "kcal": numero, "proteine": numero, "carboidrati": numero, "grassi": numero, "fibre": numero, "porzione_g": peso in grammi di una porzione normale}. Sono stime: usa valori medi realistici.',{modelTier:'quick'});
      const n=x=>{const v=Number(x);return Number.isFinite(v)&&v>=0?v:null};
      const k=n(r.kcal),p=n(r.proteine),h=n(r.carboidrati),f=n(r.grassi);
      if(k==null||p==null||h==null||f==null||k>900)throw {code:'bad'};
      EAT.est[it.seg]={id:'est-'+slug(it.seg),n:String(r.nome||it.seg).slice(0,60)+' (stima)',c:'Stime',k:Math.round(k),p:p,h:h,f:f,fi:n(r.fibre)||0,pg:n(r.porzione_g)>0?Math.round(n(r.porzione_g)):0,pn:''};
      EAT.items=eatBuild(EAT.txt);
    }catch(e){toast(aiErr(e)||'Stima non riuscita. Aggiungi l\'alimento dalla scheda Alimenti.')}
    EAT.busy=false;eatRefresh();
  }
});
EAT.busy=false;
if(window.__TEST__)window.__E={eatBuild:eatBuild,EAT:EAT};

initSample();
initStore();
})();
</script>
